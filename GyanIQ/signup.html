<!-- ES Module style — sabse reliable tarika, koi window.supabase issue nahi -->
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://tkdsvzumcribcmbsikwg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrZHN2enVtY3JpYmNtYnNpa3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2Mjg0NzMsImV4cCI6MjA5NTIwNDQ3M30.aKE22gf_yU-ybrI-CI05MZamuBG1-PXQd8OnuAYjMQU';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  /* ══════════════════════════════════════════
     LIVE USER ID PREVIEW
     ══════════════════════════════════════════
     Shows what the account's unique User ID will be, right on this page,
     by actually checking real availability against user_profiles
     (publicly readable) — not just a random guess. We remember the
     chosen candidate in localStorage so login.html (where the account
     truly gets created, since Supabase needs email verification first)
     tries this EXACT id first, so what's shown here matches what the
     user ends up with in the vast majority of cases.
  ══════════════════════════════════════════ */
  let previewUsername = null;

  async function updateUseridPreview(){
    const el = document.getElementById('useridPreview');
    const naam = document.getElementById('naam').value.trim();
    if(!naam){ el.textContent=''; previewUsername=null; return; }

    el.textContent = 'Check kar rahe hain...';
    const base = naam.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,14) || 'player';

    for(let attempt=0; attempt<6; attempt++){
      const candidate = base + Math.floor(1000 + Math.random()*9000);
      try{
        const { data } = await supabase.from('user_profiles').select('username').eq('username', candidate).maybeSingle();
        if(!data){
          previewUsername = candidate;
          el.innerHTML = 'Tumhari User ID hogi: <b>' + candidate + '</b>';
          try{ localStorage.setItem('gyaniq_reserved_username', candidate); }catch(e){}
          return;
        }
      }catch(err){ break; } // network/RLS issue — silently skip preview, login.html will still assign one
    }
    el.textContent = ''; // couldn't confirm one — not a blocker, login.html generates it regardless
  }

  let previewDebounce;
  document.getElementById('naam').addEventListener('input', ()=>{
    clearTimeout(previewDebounce);
    previewDebounce = setTimeout(updateUseridPreview, 500);
  });

  /* Normally no session exists yet right after signUp() (email
     verification required) — the real, permanent unique username gets
     generated at first LOGIN instead (see login.html). This is just a
     defensive fallback in case email verification is ever turned off for
     this project, so a session DOES exist immediately after signup. */
  async function ensureUniqueUsername(){
    try{
      const { data:{ user } } = await supabase.auth.getUser();
      if(!user) return;

      const { data: existing } = await supabase.from('user_profiles').select('username').eq('id', user.id).maybeSingle();
      if(existing && existing.username) return;

      const rawName = (user.user_metadata?.name || 'player').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,14) || 'player';
      for(let attempt=0; attempt<8; attempt++){
        const candidate = rawName + Math.floor(1000 + Math.random()*9000);
        const { error } = await supabase.from('user_profiles').insert({ id:user.id, username:candidate, full_name:user.user_metadata?.name || null });
        if(!error){ await supabase.auth.updateUser({ data:{ username: candidate } }); return; }
        if(error.code !== '23505') break;
      }
      const fallback = rawName + user.id.slice(0,6);
      await supabase.from('user_profiles').upsert({ id:user.id, username:fallback, full_name:user.user_metadata?.name || null });
      await supabase.auth.updateUser({ data:{ username: fallback } });
    }catch(err){ console.error('GyanIQ: ensureUniqueUsername failed', err); }
  }

  async function doSignup() {
    const naam  = document.getElementById('naam').value.trim();
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('pass').value;
    const btn   = document.getElementById('btn');

    if (!naam || !email || !pass) { showMsg('Sab fields bharo!', 'error'); return; }
    if (pass.length < 6) { showMsg('Password kam se kam 6 characters ka hona chahiye!', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Ho raha hai...';

    const { data, error } = await supabase.auth.signUp({
      email,
      password: pass,
      options: { data: { name: naam } }
    });

    if (error) {
      let msg = error.message;
      if (msg.includes('already registered')) msg = 'Yeh email pehle se registered hai! Login karo.';
      showMsg(msg, 'error');
      btn.disabled = false;
      btn.textContent = '🚀 Free Mein Join Karo';
    } else {
      showMsg('🎉 Account ban gaya! Email verify karo phir login karo.', 'success');
      btn.textContent = '✅ Done!';
      await ensureUniqueUsername(); // no-op if email verification is required (usual case)
      setTimeout(() => window.location.href = 'login.html', 3000);
    }
  }

  // Button ko directly JS se connect karo — onclick attribute nahi
  document.getElementById('btn').addEventListener('click', doSignup);

  document.getElementById('passToggle').addEventListener('click', ()=>{
    const inp = document.getElementById('pass');
    const btn2 = document.getElementById('passToggle');
    if(inp.type === 'password'){ inp.type = 'text'; btn2.textContent = '🙈'; }
    else{ inp.type = 'password'; btn2.textContent = '👁️'; }
  });

  document.getElementById('pass').addEventListener('input', (e)=>{
    const hint = document.getElementById('passHint');
    const len = e.target.value.length;
    if(len === 0){
      hint.textContent = 'Kam se kam 6 characters ka koi bhi naya password banao.';
      hint.className = 'pass-hint';
    } else if(len < 6){
      hint.textContent = '❌ Abhi ' + len + ' characters hain — kam se kam 6 chahiye (' + (6-len) + ' aur likho).';
      hint.className = 'pass-hint bad';
    } else {
      hint.textContent = '✅ Password ki length theek hai.';
      hint.className = 'pass-hint ok';
    }
  });
</script>
</body>
