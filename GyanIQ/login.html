<body>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://tkdsvzumcribcmbsikwg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrZHN2enVtY3JpYmNtYnNpa3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2Mjg0NzMsImV4cCI6MjA5NTIwNDQ3M30.aKE22gf_yU-ybrI-CI05MZamuBG1-PXQd8OnuAYjMQU';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  /* ══════════════════════════════════════════
     UNIQUE USERNAME — this is where it actually gets created.
     At signup, Supabase requires email verification before a real
     session exists, so we can't safely create it there. The FIRST
     successful login (right here) is the earliest point a session is
     guaranteed to exist — so that's where we permanently generate and
     save a database-guaranteed-unique username (e.g. "rahul4821"),
     built from the name they gave at signup. Once saved here, every
     other page (games, tournaments, leaderboard) just reads it back —
     nothing else needs to generate it again.
  ══════════════════════════════════════════ */
  async function ensureUniqueUsername(){
    try{
      const { data:{ user } } = await supabase.auth.getUser();
      if(!user) return null;

      const { data: existing } = await supabase.from('user_profiles').select('username').eq('id', user.id).maybeSingle();
      if(existing && existing.username){
        if(user.user_metadata?.username !== existing.username){
          await supabase.auth.updateUser({ data:{ username: existing.username } });
        }
        return existing.username;
      }

      const rawName = (user.user_metadata?.name || 'player').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,14) || 'player';

      // Try the exact id that was previewed on the signup page first, so
      // it matches what the person was already shown there.
      let reserved = null;
      try{ reserved = localStorage.getItem('gyaniq_reserved_username'); }catch(e){}
      if(reserved){
        const { error } = await supabase.from('user_profiles').insert({ id:user.id, username:reserved, full_name:user.user_metadata?.name || null });
        try{ localStorage.removeItem('gyaniq_reserved_username'); }catch(e){}
        if(!error){
          await supabase.auth.updateUser({ data:{ username: reserved } });
          return reserved;
        }
        // someone else grabbed it in the meantime (rare) — fall through to fresh generation
      }

      for(let attempt=0; attempt<8; attempt++){
        const candidate = rawName + Math.floor(1000 + Math.random()*9000); // 4-digit random
        const { error } = await supabase.from('user_profiles').insert({ id:user.id, username:candidate, full_name:user.user_metadata?.name || null });
        if(!error){
          await supabase.auth.updateUser({ data:{ username: candidate } });
          return candidate;
        }
        if(error.code !== '23505') break; // not a duplicate-username error — stop retrying
      }
      // Extremely unlikely fallback: guarantee uniqueness via the user's own id.
      const fallback = rawName + user.id.slice(0,6);
      await supabase.from('user_profiles').upsert({ id:user.id, username:fallback, full_name:user.user_metadata?.name || null });
      await supabase.auth.updateUser({ data:{ username: fallback } });
      return fallback;
    }catch(err){ console.error('GyanIQ: ensureUniqueUsername failed', err); return null; }
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('pass').value;
    const btn   = document.getElementById('btn');

    if (!email || !pass) { showMsg('Dono fields bharo!', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Login ho raha hai...';

    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });

    if (error) {
      let msg = 'Email ya password galat hai!';
      if (error.message.includes('Email not confirmed')) msg = 'Pehle email verify karo! Inbox check karo.';
      showMsg(msg, 'error');
      btn.disabled = false;
      btn.textContent = '🔓 Login Karo';
    } else {
      btn.textContent = '✅ Login ho gaya...';
      const username = await ensureUniqueUsername();
      showMsg(username ? ('✅ Login ho gaya! Tumhari User ID: ' + username) : '✅ Login ho gaya!', 'success');
      setTimeout(() => window.location.href = 'games.html', 1200);
    }
  }

  document.getElementById('btn').addEventListener('click', doLogin);

  document.getElementById('passToggle').addEventListener('click', ()=>{
    const inp = document.getElementById('pass');
    const btn2 = document.getElementById('passToggle');
    if(inp.type === 'password'){ inp.type = 'text'; btn2.textContent = '🙈'; }
    else{ inp.type = 'password'; btn2.textContent = '👁️'; }
  });
</script>
