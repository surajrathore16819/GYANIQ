<!-- SEO-H1:START (auto-generated, visually hidden - do not hand-edit) --><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Naya Password Set Karo</h1><!-- SEO-H1:END -->

  <div id="formWrap">

      <div class="pass-wrap">
        <input type="password" id="pass1" placeholder="Kam se kam 6 characters" autocomplete="new-password">

    <div class="field">

        <input type="password" id="pass2" placeholder="Wahi password dubara" autocomplete="new-password">
        <button type="button" class="pass-toggle" id="passToggle2" tabindex="-1">👁️</button>
      </div>
    </div>
    <button class="btn" id="btn">🔐 Password Update Karo</button>

  <div class="msg" id="msg"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://tkdsvzumcribcmbsikwg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrZHN2enVtY3JpYmNtYnNpa3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2Mjg0NzMsImV4cCI6MjA5NTIwNDQ3M30.aKE22gf_yU-ybrI-CI05MZamuBG1-PXQd8OnuAYjMQU';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const formWrap   = document.getElementById('formWrap');
  const cardSub    = document.getElementById('cardSub');
  const switchLink = document.getElementById('switchLink');

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function lockForm(message) {
    formWrap.style.display = 'none';
    switchLink.style.display = 'block';
    showMsg(message, 'error');
  }

  /* ══════════════════════════════════════════
     Supabase sends the person here with a recovery token in the URL
     (as a #access_token=... fragment, or via a `code` query param
     depending on the email-link flow). The SDK automatically reads
     this from the URL and — for a valid, unexpired link — fires
     a PASSWORD_RECOVERY auth event with a temporary session that is
     ONLY good for calling updateUser({ password }) below.

     If the link is invalid/expired, no such session appears, so the
     form is locked with a clear message instead of silently failing
     when the person submits a new password.
  ══════════════════════════════════════════ */
  let recoveryReady = false;

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      recoveryReady = true;
    }
  });

  // Fallback check in case the event already fired before this listener
  // was attached (can happen depending on load timing).
  setTimeout(async () => {
    if (recoveryReady) return;
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      recoveryReady = true;
    } else {
      lockForm('Ye reset link invalid ya expire ho chuka hai. "Password bhool gaye?" se dobara try karo.');
    }
  }, 2500);

  document.getElementById('btn').addEventListener('click', async () => {
    const pass1 = document.getElementById('pass1').value;
    const pass2 = document.getElementById('pass2').value;
    const btn = document.getElementById('btn');

    if (!recoveryReady) {
      showMsg('Ye reset link invalid ya expire ho chuka hai. "Password bhool gaye?" se dobara try karo.', 'error');
      return;
    }
    if (!pass1 || !pass2) { showMsg('Dono fields bharo!', 'error'); return; }
    if (pass1.length < 6) { showMsg('Password kam se kam 6 characters ka hona chahiye', 'error'); return; }
    if (pass1 !== pass2) { showMsg('Dono password match nahi kar rahe', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Update ho raha hai...';

    const { error } = await supabase.auth.updateUser({ password: pass1 });

    if (error) {
      showMsg('Kuch galat ho gaya: ' + error.message, 'error');
      btn.disabled = false;
      btn.textContent = '🔐 Password Update Karo';
      return;
    }

    formWrap.style.display = 'none';
    cardSub.textContent = 'Ho gaya! 🎉';
    switchLink.style.display = 'block';
    showMsg('Password successfully update ho gaya! Ab naye password se login karo.', 'success');
    setTimeout(() => window.location.href = 'login.html', 2000);
  });

  document.getElementById('passToggle1').addEventListener('click', () => {
    const inp = document.getElementById('pass1');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('passToggle2').addEventListener('click', () => {
    const inp = document.getElementById('pass2');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
</script>
